<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.O.E. | DMO Operator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; touch-action: manipulation; }
        .progress-bar-fill { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        /* Prevent text selection on rapid tapping */
        button { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="w-full bg-gray-900 border-b border-gray-800 py-4 px-6 flex justify-between items-center sticky top-0 z-10">
        <div>
            <div class="font-black tracking-tighter text-xl text-white">M.O.E. <span class="text-gray-500 font-normal">DMO</span></div>
            <div class="text-[10px] uppercase tracking-widest text-green-500 font-bold flex items-center mt-1">
                <span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span> SYSTEM LIVE: KL CITY CENTRE
            </div>
        </div>
        <div class="text-right">
            <div class="text-[10px] text-gray-500 uppercase tracking-widest">Operator</div>
            <div class="font-bold text-sm">JOEY_TAN</div>
        </div>
    </header>

    <main class="flex-grow p-4 flex flex-col gap-6">

        <section class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-2xl">
            <div class="flex justify-between items-end mb-2">
                <h2 class="text-xs uppercase tracking-widest text-gray-400 font-bold">Volume Progression</h2>
                <span class="text-xl font-black text-white" id="vp-text">1,500 <span class="text-sm text-gray-500 font-normal">/ 2,000 VP</span></span>
            </div>
            
            <div class="w-full h-4 bg-gray-800 rounded-full overflow-hidden mb-3">
                <div id="vp-bar" class="h-full bg-blue-600 progress-bar-fill" style="width: 75%;"></div>
            </div>

            <div class="w-full bg-black border border-gray-800 rounded-lg p-3 flex items-center justify-between opacity-70">
                <div class="flex items-center gap-3">
                    <span class="text-lg">🔒</span>
                    <div>
                        <div class="text-xs font-bold text-gray-300">MASTER OPERATING SYSTEM</div>
                        <div class="text-[10px] text-gray-500 uppercase">Requires Active Supervisor Status</div>
                    </div>
                </div>
                <div class="text-xs font-bold text-blue-500">500 VP LEFT</div>
            </div>
        </section>

        <section class="flex-grow flex flex-col gap-3">
            <div class="text-center mb-2">
                <h1 class="text-sm font-bold uppercase tracking-widest text-gray-400">The 10:1 Intercept Matrix</h1>
                <p class="text-xs text-gray-600 mt-1">Collect the "No" to unlock the "Yes"</p>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-2">
                <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                    <div class="text-[10px] text-gray-500 uppercase font-bold mb-1">Intercepts</div>
                    <div class="text-2xl font-black" id="stat-intercepts">0</div>
                </div>
                <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                    <div class="text-[10px] text-gray-500 uppercase font-bold mb-1">Samples</div>
                    <div class="text-2xl font-black text-green-500" id="stat-samples">0</div>
                </div>
                <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                    <div class="text-[10px] text-gray-500 uppercase font-bold mb-1">Ratio</div>
                    <div class="text-2xl font-black text-blue-500" id="stat-ratio">0:0</div>
                </div>
            </div>

            <div class="flex-grow flex flex-col gap-4 mt-2">
                <button onclick="logData('reject')" class="flex-grow bg-red-950 border-2 border-red-900 rounded-2xl flex flex-col items-center justify-center active:bg-red-900 transition-colors shadow-[0_0_15px_rgba(220,38,38,0.2)]">
                    <span class="text-5xl mb-2">🛑</span>
                    <span class="text-2xl font-black tracking-widest text-red-500">REJECTED</span>
                    <span class="text-xs text-red-700 font-bold uppercase mt-1">Data Point Collected</span>
                </button>

                <button onclick="logData('sample')" class="flex-grow bg-green-950 border-2 border-green-800 rounded-2xl flex flex-col items-center justify-center active:bg-green-800 transition-colors shadow-[0_0_15px_rgba(22,163,74,0.2)]">
                    <span class="text-5xl mb-2">🥤</span>
                    <span class="text-2xl font-black tracking-widest text-green-400">SAMPLED</span>
                    <span class="text-xs text-green-700 font-bold uppercase mt-1">Liquid Trust Deployed</span>
                </button>
            </div>
        </section>

    </main>

    <script>
        // Temporary Local State (Will be connected to Vercel/Postgres DB later)
        let intercepts = 0;
        let samples = 0;
        let currentVP = 1500; // Hardcoded simulation for the psychological trap

        function logData(type) {
            // Haptic Feedback for physical sensation on the street
            if (navigator.vibrate) { navigator.vibrate(50); }

            intercepts++;
            
            if (type === 'sample') {
                samples++;
                // Simulate VP growth to trigger the gamification loop
                currentVP += 12; // Example VP for a basic starter interaction
                if (currentVP > 2000) currentVP = 2000;
                updateAscensionBar();
            }

            updateMetrics();
        }

        function updateMetrics() {
            document.getElementById('stat-intercepts').innerText = intercepts;
            document.getElementById('stat-samples').innerText = samples;
            
            // Calculate Ratio
            let ratioText = intercepts === 0 ? "0:0" : `${(intercepts / (samples === 0 ? 1 : samples)).toFixed(1)}:1`;
            document.getElementById('stat-ratio').innerText = ratioText;
        }

        function updateAscensionBar() {
            document.getElementById('vp-text').innerHTML = `${currentVP.toLocaleString()} <span class="text-sm text-gray-500 font-normal">/ 2,000 VP</span>`;
            let percentage = (currentVP / 2000) * 100;
            document.getElementById('vp-bar').style.width = `${percentage}%`;

            if (currentVP >= 2000) {
                document.getElementById('vp-bar').classList.remove('bg-blue-600');
                document.getElementById('vp-bar').classList.add('bg-green-500');
            }
        }
    </script>
</body>
</html>
